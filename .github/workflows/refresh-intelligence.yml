name: Refresh daily intelligence

on:
  schedule:
    - cron: "17 3 * * *"  # daily at 08:47 India / 06:17 Uganda
  push:
    paths:
      - "pipeline/fetch_intelligence.py"
      - ".github/workflows/refresh-intelligence.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: husk-and-fibre-content-refresh
  cancel-in-progress: false

jobs:
  refresh-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install feed dependencies
        run: pip install feedparser requests python-dateutil

      - name: Build intelligence feed
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python pipeline/fetch_intelligence.py

      - name: Commit updated intelligence
        run: |
          git config user.name "husk-and-fibre-bot"
          git config user.email "bot@users.noreply.github.com"
          git add intelligence.json
          git diff --cached --quiet || git commit -m "Refresh intelligence $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
